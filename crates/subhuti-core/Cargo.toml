[package]
name = "subhuti-core"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
smallvec = "1.11"
itertools = "0.12"
futures = "0.3"
hashbrown = "0.14"
dashmap = "5.5"
backoff = "0.4"
tokio = { version = "1.0", features = ["sync", "time", "rt", "macros"] }
anyhow = "1.0"
regex = "1.10"
memory-stats = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
[package]
name = "subhuti-infra"
version = "0.1.0"
edition = "2021"

[dependencies]
subhuti-core = { path = "../subhuti-core" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json", "native-tls"] }
sqlx = { version = "0.8", features = ["sqlite", "postgres", "runtime-tokio-native-tls", "macros", "chrono"] }
regex = "1.10"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
dotenvy = "0.15"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
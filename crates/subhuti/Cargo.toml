# Subhuti - Rust 极简轻量 AI Agent 框架
# 设计哲学：薄封装、无魔法、无全局状态

[package]
name = "subhuti"
version = "0.1.0"
edition = "2021"
description = "Rust 极简轻量 AI Agent 框架"
license = "MIT"
repository = "https://github.com/yourname/subhuti"
keywords = ["ai", "agent", "llm", "rust"]
categories = ["ai", " robotics"]

[dependencies]
subhuti-core = { path = "../subhuti-core" }
subhuti-infra = { path = "../subhuti-infra" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["sync", "time", "rt", "macros"] }
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
smallvec = "1.11"
itertools = "0.12"
futures = "0.3"
hashbrown = "0.14"
dashmap = "5.5"
backoff = "0.4"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "native-tls"] }
sqlx = { version = "0.8", features = ["sqlite", "postgres", "runtime-tokio-native-tls", "macros", "chrono"] }
regex = "1.10"
dotenvy = "0.15"

[dev-dependencies]
mockall = "0.12"
tempfile = "3"
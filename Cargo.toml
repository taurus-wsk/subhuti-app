[workspace]
members = [
    "crates/subhuti-core",
    "crates/subhuti-infra",
    "crates/subhuti-plugin-sdk",
    "crates/subhuti-expert-psychology-wasm",
]
resolver = "2"

[package]
name = "subhuti-app"
version = "0.1.0"
edition = "2021"
default-run = "subhuti"

[[bin]]
name = "subhuti"
path = "src/bin/main.rs"

[[bin]]
name = "subhuti-app"
path = "src/bin/subhuti_app.rs"

[dependencies]
subhuti-core = { path = "crates/subhuti-core" }
subhuti-infra = { path = "crates/subhuti-infra" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "time"] }
tracing-appender = "0.2"
async-trait = "0.1"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }

# Axum HTTP 框架
axum = { version = "0.7", features = ["macros"] }
hyper = { version = "1", features = ["full"] }
http-body = "1"
http-body-util = "0.1"
bytes = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tower-layer = "0.3"
tower-service = "0.3"

# 路由自动注册（编译期收集，方案 C）
inventory = "0.3"

# HTTP 客户端（用于调用外部 LLM API）
reqwest = { version = "0.12", features = ["json"] }

# 工具库
futures = "0.3"

# 环境变量加载
dotenvy = "0.15"

# 内存统计（函数调用链路追踪 - 内存变化采集）
memory-stats = "1.0"

# TOML 配置解析
toml = "0.8"

# UUID 生成
uuid = { version = "1", features = ["v4"] }

# SSE 支持
async-stream = "0.3"
tokio-stream = "0.1"

# CLI 工具依赖
clap = { version = "4", features = ["derive"] }
colored = "2"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "json"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

